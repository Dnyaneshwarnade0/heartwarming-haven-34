<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गुरुकुल सहाय्यक — बॉट</title>
    <link rel="icon" href="logo_1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --navy:#1B3A6B; --blue:#2563EB; }
        * { box-sizing:border-box; }
        body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:#F3F6FB; height:100vh; display:flex; flex-direction:column; }
        header { background:linear-gradient(135deg,var(--navy),var(--blue)); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:10px; }
        header img { width:34px; height:34px; border-radius:50%; background:#fff; object-fit:contain; }
        header b { font-size:1.05rem; }
        header small { display:block; opacity:.8; font-weight:400; font-size:.75rem; }
        #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
        .msg { max-width:82%; padding:10px 14px; border-radius:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; box-shadow:0 2px 8px rgba(27,58,107,.08); }
        .me { align-self:flex-end; background:var(--navy); color:#fff; border-bottom-right-radius:4px; }
        .bot { align-self:flex-start; background:#fff; color:#16233c; border-bottom-left-radius:4px; }
        #chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 16px 8px; }
        #chips button { border:1px solid #cfdcf3; background:#fff; color:var(--navy); border-radius:20px; padding:7px 13px; font-size:.85rem; cursor:pointer; }
        form { display:flex; gap:8px; padding:12px 16px 18px; background:#fff; border-top:1px solid #e5ebf6; }
        textarea { flex:1; resize:none; border:1px solid #d6e0f0; border-radius:12px; padding:11px 13px; font-size:.95rem; font-family:inherit; }
        button.send { border:0; background:var(--blue); color:#fff; width:46px; border-radius:12px; font-size:1rem; cursor:pointer; }
    </style>
</head>
<body>
    <header>
        <img src="logo_1.png" alt="">
        <div><b>गुरुकुल सहाय्यक</b><small>राम कृष्ण हरी — विचारा, मी मदत करतो</small></div>
    </header>
    <div id="log"></div>
    <div id="chips"></div>
    <form id="f">
        <textarea id="q" rows="1" placeholder="इथे प्रश्न लिहा…"></textarea>
        <button class="send" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
    </form>

    <script>
        (function () {
            var log = document.getElementById('log');
            var chips = document.getElementById('chips');
            var history = [];

            function snapshot() {
                try {
                    var s = JSON.parse(localStorage.getItem('vss_students') || '[]');
                    return {
                        students: s.map(function (x) {
                            return {
                                id: x.id, rollNo: x.rollNo, name: x.name, standard: x.standard,
                                parentName: x.parentName, phone: x.phone,
                                fees: x.fees, complaints: x.complaints || x.incidents || [],
                                medical: x.medical, subjects: x.subjects, subjectMarks: x.subjectMarks,
                                dailyAttendance: x.dailyAttendance
                            };
                        }),
                        adarsh: localStorage.getItem('vss_adarsh_week') || null,
                        today: new Date().toISOString().slice(0, 10)
                    };
                } catch (e) { return {}; }
            }

            function add(role, text) {
                var d = document.createElement('div');
                d.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
                d.textContent = text;
                log.appendChild(d);
                log.scrollTop = log.scrollHeight;
            }

            function setChips(list) {
                chips.innerHTML = '';
                (list || []).forEach(function (o) {
                    var b = document.createElement('button');
                    b.textContent = o;
                    b.onclick = function () { send(o); };
                    chips.appendChild(b);
                });
            }

            function send(text) {
                if (!text) return;
                add('user', text);
                history.push({ role: 'user', content: text });
                setChips([]);
                add('assistant', '…');
                var placeholder = log.lastChild;
                fetch('/api/public/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: history.slice(-16), context: snapshot() })
                }).then(function (r) { return r.json().catch(function () { return {}; }); })
                    .then(function (data) {
                        var reply = data.reply || 'उत्तर मिळाले नाही. पुन्हा प्रयत्न करा.';
                        var opts = [];
                        var m = reply.match(/```options\s*([\s\S]*?)```/);
                        if (m) {
                            try { opts = JSON.parse(m[1].trim()) || []; } catch (e) { }
                            reply = reply.replace(m[0], '').trim();
                        }
                        reply = reply.replace(/```action[\s\S]*?```/g, '').trim();
                        placeholder.textContent = reply;
                        history.push({ role: 'assistant', content: reply });
                        setChips(opts.slice(0, 4));
                    })
                    .catch(function () { placeholder.textContent = 'नेटवर्क त्रुटी.'; });
            }

            document.getElementById('f').addEventListener('submit', function (e) {
                e.preventDefault();
                var q = document.getElementById('q');
                var v = q.value.trim();
                q.value = '';
                send(v);
            });

            add('assistant', '🙏 राम कृष्ण हरी, अंकुश महाराज!\nमी स्वप्निल बॉट — गुरुकुल सहाय्यक. काय मदत करू?');
            setChips(['आजची हजेरी किती?', 'फी बाकी कोणाची?', 'तक्रारी दाखवा', 'आदर्श विद्यार्थी कोण?']);
        })();
    </script>
</body>
</html>
